        implementation group: 'io.prometheus', name: 'simpleclient_common', version: "${prometheusVersion}"
        //阿里云
        implementation group: 'com.aliyun', name: 'aliyun-java-sdk-core', version: "${aliyunjavasdkcoreVersion}"
        //dingtalk
        implementation group: 'com.aliyun', name: 'alibaba-dingtalk-service-sdk', version: "${aliyundingtalkVersion}"
        //opentracing
        implementation group: 'io.opentracing', name: 'opentracing-api', version: "${opentracingVersion}"
        implementation group: 'io.opentracing', name: 'opentracing-noop', version: "${opentracingVersion}"
        implementation group: 'io.opentracing', name: 'opentracing-util', version: "${opentracingVersion}"
        //阿里云aliyun-java-sdk-core依赖jakarta.xml.bind
        implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.1'
        //腾讯云
        implementation group: 'com.tencentcloudapi', name: 'tencentcloud-sdk-java', version: "${tencentcloudsdkjavaVersion}"
        //docs
        implementation group: 'org.mapstruct', name: 'mapstruct', version: "${mapstructVersion}"
        implementation group: 'io.swagger.core.v3', name: 'swagger-annotations-jakarta', version: "${swaggerV3Version}"
        implementation group: 'io.swagger.core.v3', name: 'swagger-core-jakarta', version: "${swaggerV3Version}"
        implementation group: 'io.swagger.core.v3', name: 'swagger-models-jakarta', version: "${swaggerV3Version}"
        // [Spring Boot 4 升级] SpringDoc 3.0.x 仍引用 Jackson 2 (com.fasterxml.jackson.databind.node.ObjectNode),
        // 跟 Boot 4.1 默认 Jackson 3 (tools.jackson) 不兼容.
        // 用 spring-boot-jackson2 模块保留 Jackson 2 兼容模式,只对 springdoc 范围生效
        implementation group: 'io.github.classgraph', name: 'classgraph', version: "${classgraphVersion}"
        implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-common', version: "${springdocVersion}"
        implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-api', version: "${springdocVersion}"
        implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: "${springdocVersion}"

        //webjars
        implementation group: 'org.webjars', name: 'webjars-locator-lite', version: "${webjarslocatorLiteVersion}"
        implementation group: 'org.webjars', name: 'swagger-ui', version: "${swaggeruiVersion}"

    }

    jar {
        def currentTime = ZonedDateTime.now()
        manifest {
            attributes(
                    "Implementation-Title": project.name,
                    "Implementation-Vendor": project.vendor,
                    "Created-By": project.author,
                    "Implementation-Date": currentTime,
                    "Implementation-Version": project.version
            )
        }
    }

    tasks.register("buildRelease", Copy) {
        dependsOn assemble
        //项目名 项目所在的group version 版本号
        println "subproject " + project.name + ", group " + project.group + " , version " + project.version

        //copy
        into "$rootDir/build/"
        from "$buildDir/libs/"
        include '*-boot-*.jar'
    }

    assemble.configure { finalizedBy buildRelease }
}

tasks.register("buildRelease") {
    //项目名 项目所在的group version 版本号
    println "Root project " + project.name + ", group " + project.group + " , version " + project.version
    //项目的绝对路径 to 项目的build文件绝对路径
    println "Root project projectDir " + project.projectDir + " to " + project.buildDir
}

build.configure {
    finalizedBy buildRelease

    println ""
    println "Gradle version is ${GradleVersion.current().version}"
}

// In this section you declare the dependencies for your production and test code
dependencies {

}

// [Spring Boot 4 升级] allprojects 块确保所有子项目(含 nested subproject,例如 jinbooks-starter:jinbooks-starter-web)拿到 spring-boot-webmvc 和 spring-boot-web-server 子 artifact
// subprojects 块不递归到 nested subproject,所以需要单独开 allprojects 块
allprojects {
    dependencies {
        // [Spring Boot 4 升级] transitive=false 禁了 starter 传递, ExceptionEndpoint / SpringDocConfiguration / MvcAutoConfiguration 用的 AbstractErrorController/ErrorAttributes/WebMvcAutoConfiguration/ServerProperties/ErrorPage 等类需要这些子 artifact
        implementation group: 'org.springframework.boot', name: 'spring-boot-webmvc', version: "${springBootVersion}"
        implementation group: 'org.springframework.boot', name: 'spring-boot-web-server', version: "${springBootVersion}"
        // [Spring Boot 4 升级] spring-boot-servlet 4.1 新拆出模块,含 OrderedFilter / OrderedRequestContextFilter 等 filter 基类
        // (被 WebMvcAutoConfiguration 引用,transitive=false 需显式声明)
        implementation group: 'org.springframework.boot', name: 'spring-boot-servlet', version: "${springBootVersion}"
        // [Spring Boot 4 升级] spring-boot-http-converter 4.1 新拆出模块,含 ServerHttpMessageConvertersCustomizer 等
        // (被 WebMvcAutoConfiguration 引用,transitive=false 需显式声明)
        implementation group: 'org.springframework.boot', name: 'spring-boot-http-converter', version: "${springBootVersion}"
        // [Spring Boot 4 升级] spring-boot-jdbc 4.1 新拆出模块,含 org.springframework.boot.jdbc.autoconfigure.DataSourceProperties 等
        implementation group: 'org.springframework.boot', name: 'spring-boot-jdbc', version: "${springBootVersion}"
        // [Spring Boot 4 升级] spring-boot-sql 4.1 新拆出模块,含 org.springframework.boot.sql.init.dependency.DatabaseInitializationDependencyConfigurer 等
        implementation group: 'org.springframework.boot', name: 'spring-boot-sql', version: "${springBootVersion}"

        // [Spring Boot 4 升级] Jackson 3 显式版本 (transitive=false 下 enforcedPlatform 不能插值到 implementation, 只能写死版本号)
        // 注解 jackson-annotations 仍用 2.x (Jackson 3 复用 com.fasterxml.jackson.annotation 包)
        // jackson-datatype-{jdk8,jsr310} + jackson-module-parameter-names 在 Jackson 3 已合并到 jackson-databind
        implementation 'com.fasterxml.jackson.core:jackson-annotations:2.21'
        implementation 'tools.jackson.core:jackson-core:3.1.4'
        implementation 'tools.jackson.core:jackson-databind:3.1.4'
        implementation 'tools.jackson.dataformat:jackson-dataformat-yaml:3.1.4'
        implementation 'tools.jackson.dataformat:jackson-dataformat-xml:3.1.4'
        implementation 'tools.jackson.module:jackson-module-jaxb-annotations:3.1.4'
        implementation 'tools.jackson.module:jackson-module-jakarta-xmlbind-annotations:3.1.4'
        // [Spring Boot 4 升级] springdoc-openapi 3.0.3 仍引 Jackson 2 (com.fasterxml.jackson.databind.node.ObjectNode),
        // 在 Jackson 3 主线之外,额外挂 Jackson 2 core+databind 让 springdoc 自己用 (跟 Spring Boot 主 mapper 隔离)
        implementation 'com.fasterxml.jackson.core:jackson-core:2.21.4'
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.4'
        // [Spring Boot 4 升级] springdoc 3.0.x 还要 jackson-datatype-jsr310 / jdk8,Jackson 2 时代是独立 module
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.4'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.21.4'
        // [Spring Boot 4 升级] springdoc 3.0.x 还要 jackson-dataformat-yaml / xml (Jackson 2 时代是独立 module)
        implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.21.4'
        implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.21.4'
    }
}
