version: "3.8"

services:
  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: jinbooks-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PWD:-JinbooksRedis321!}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PWD:-JinbooksRedis321!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jinbooks-network

  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: jinbooks-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-JinbooksRoot321!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jinbooks}
      MYSQL_USER: ${MYSQL_USER:-jinbooks}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Jinbooks321!}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/jinbooks_v1.1.0.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-JinbooksRoot321!}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - jinbooks-network

  # JinBooks 后端服务
  backend:
    build:
      context: ./jinbooks
      dockerfile: ../docker/backend/Dockerfile
    container_name: jinbooks-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 2154
      SERVER_CACHED: ${SERVER_CACHED:-0}
      DATABASE_HOST: jinbooks-mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-jinbooks}
      DATABASE_USER: ${MYSQL_USER:-jinbooks}
      DATABASE_PWD: ${MYSQL_PASSWORD:-Jinbooks321!}
      REDIS_HOST: jinbooks-redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PWD: ${REDIS_PWD:-}
      LOGIN_IPLOCATION: ${LOGIN_IPLOCATION:-false}
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-2154}:2154"
    volumes:
      - ./logs/backend:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:2154/jinbooks-api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - jinbooks-network

  # JinBooks 前端服务 (Nginx)
  frontend:
    build:
      context: ./jinbooks-ui
      dockerfile: ../docker/frontend/Dockerfile
    container_name: jinbooks-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jinbooks-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  jinbooks-network:
    driver: bridge
